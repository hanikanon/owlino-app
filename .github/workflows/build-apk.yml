name: Build Owlino APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -storetype JKS \
            -keystore android.keystore -alias owlino \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass owlino2026 -keypass owlino2026 \
            -dname "CN=Owlino, OU=Ather, O=Owlino, L=Algeria, S=Algeria, C=DZ"

      - name: Bubblewrap init
        run: |
          bubblewrap init --manifest https://hanikanon.github.io/owlino-app/manifest.json \
            --directory . \
            --packageId com.ather.owlino \
            --name Owlino \
            --signingKeyPath android.keystore \
            --signingKeyAlias owlino \
            --skipPwaValidation << EOF
          No
          ${JAVA_HOME}
          Yes
          owlino2026
          owlino2026
          EOF

      - name: Bubblewrap build
        run: |
          bubblewrap build --skipPwaValidation << 'EOF'
          owlino2026
          owlino2026
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: owlino-apk
          path: app-release-signed.apk
