name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Show environment
        run: node -v && npm -v

      - name: Build web app (Capacitor CSR build)
        run: npm run build:capacitor 2>&1 | tee build.log
        continue-on-error: false

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Show build output (debug)
        run: |
          echo "--- searching for index.html (depth 6) ---"
          find . -maxdepth 6 -iname "*.html" -not -path "*/node_modules/*" || true
          echo "--- .output full tree (if exists) ---"
          find .output 2>/dev/null || echo "(no .output dir)"
          echo "--- dist tree (if exists) ---"
          find dist -maxdepth 4 2>/dev/null || echo "(no dist dir)"

      - name: Add Android platform (first run only)
        run: test -d android || npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptvora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
